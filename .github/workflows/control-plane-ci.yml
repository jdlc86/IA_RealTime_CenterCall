name: Control Plane CI

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - "docs/**"
      - ".github/workflows/control-plane-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: apps/control-plane/.node-version

      - name: Install dependencies
        run: npx --yes npm@10.9.2 clean-install --progress=false --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Wrangler dry-run
        run: npm run check
