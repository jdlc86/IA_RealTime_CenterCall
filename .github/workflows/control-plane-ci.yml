name: Control Plane CI

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test-output.log

      - name: Upload Node test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: apps/control-plane/node-test-output.log
          if-no-files-found: error
          retention-days: 1

      - name: Wrangler dry-run
        run: npm run check
