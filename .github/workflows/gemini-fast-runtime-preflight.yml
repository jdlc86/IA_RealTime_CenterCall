name: Gemini Fast Runtime Preflight

on:
  push:
    branches:
      - rebuild/v39-stable-baseline
    paths:
      - ".github/workflows/gemini-fast-runtime-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check reusable runtime credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
      TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secret presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TELNYX_API_KEY TELNYX_PUBLIC_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING:${name}"
              missing=1
            else
              echo "PRESENT:${name}"
            fi
          done
          exit "$missing"
