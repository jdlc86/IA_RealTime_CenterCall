name: Gemini Fast Worker Deploy

on:
  push:
    branches:
      - rebuild/v39-stable-baseline
    paths:
      - "apps/gemini-control-plane/**"
      - ".github/workflows/gemini-fast-worker-deploy.yml"
  pull_request:
    paths:
      - ".github/workflows/gemini-fast-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-fast-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy independent Gemini fast Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gemini-control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FAST_WORKER_ORIGIN: https://ia-realtime-centercall-gemini-fast.julopezcardona.workers.dev
      TENANT_ROUTING_KV_NAMESPACE: ia-realtime-centercall-gemini-fast-tenant-routing-kv

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate fast Worker artifact
        run: npm run check

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve tenant routing KV namespace
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          LIST="$(curl --fail --silent --show-error \
            -H "$AUTH" \
            "${API}?per_page=1000")"

          KV_ID="$(node -e '
            const payload = JSON.parse(process.argv[1]);
            const title = process.argv[2];
            if (payload.success !== true) process.exit(2);
            const match = (payload.result || []).find((item) => item.title === title);
            if (match?.id) process.stdout.write(match.id);
          ' "$LIST" "$TENANT_ROUTING_KV_NAMESPACE")"

          if [ -z "$KV_ID" ]; then
            echo "KV namespace not found; creating it by logical name."
            CREATED="$(curl --fail --silent --show-error \
              -X POST \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "{\"title\":\"${TENANT_ROUTING_KV_NAMESPACE}\"}" \
              "$API")"
            KV_ID="$(node -e '
              const payload = JSON.parse(process.argv[1]);
              if (payload.success !== true || !payload.result?.id) process.exit(2);
              process.stdout.write(payload.result.id);
            ' "$CREATED")"
          fi

          test -n "$KV_ID"
          echo "KV namespace resolved: ${TENANT_ROUTING_KV_NAMESPACE}"
          echo "TENANT_ROUTING_KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Build ephemeral Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('wrangler.fast.jsonc', 'utf8'));
          const id = process.env.TENANT_ROUTING_KV_ID;
          if (!id) throw new Error('TENANT_ROUTING_KV_ID was not resolved');
          source.kv_namespaces = [{ binding: 'TENANT_ROUTING_KV', id }];
          fs.writeFileSync('wrangler.fast.runtime.jsonc', `${JSON.stringify(source, null, 2)}\n`);
          NODE

      - name: Deploy independent Gemini fast Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.fast.runtime.jsonc 2>&1 | tee /tmp/gemini-fast-worker-deploy.log
          grep -q 'TENANT_ROUTING_KV' /tmp/gemini-fast-worker-deploy.log

      - name: Verify deployed Worker is visible to Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --config wrangler.fast.runtime.jsonc

      - name: Seed safe tenant configuration placeholders
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          KV_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${TENANT_ROUTING_KV_ID}/values"

          put_if_missing() {
            local key="$1"
            local value="$2"
            local encoded_key
            local url
            local status
            encoded_key="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$key")"
            url="${KV_BASE}/${encoded_key}"
            status="$(curl --silent --show-error -o /tmp/kv-placeholder -w '%{http_code}' -H "$AUTH" "$url")"
            if [ "$status" = "404" ]; then
              curl --fail --silent --show-error \
                -X PUT \
                -H "$AUTH" \
                -H 'Content-Type: application/json' \
                --data "$value" \
                "$url" >/dev/null
              echo "Created disabled placeholder: $key"
            elif [ "$status" = "200" ]; then
              echo "KV entry already exists; leaving it unchanged: $key"
            else
              echo "Unexpected KV lookup status $status for $key" >&2
              cat /tmp/kv-placeholder >&2 || true
              exit 1
            fi
          }

          put_if_missing \
            'tenant_by_phone:+34XXXXXXXXX' \
            '{"tenant_id":"TENANT_ID_A_COMPLETAR","route_id":"default","enabled":false}'

          put_if_missing \
            'tenant_capabilities:TENANT_ID_A_COMPLETAR' \
            '{"tenant_id":"TENANT_ID_A_COMPLETAR","call":{"transfer":false},"whatsapp":{"transactional":false,"realtime_support":false}}'

          put_if_missing \
            'tenant_config:TENANT_ID_A_COMPLETAR' \
            '{"schemaVersion":1,"tenantId":"TENANT_ID_A_COMPLETAR","status":"inactive","humanHandoff":{"enabled":false,"destination":{"type":"PHONE","phone":"xxxxxxxx","label":"Recepción"},"transfer":{"mode":"BLIND","answerTimeoutSeconds":25},"successMessage":"De acuerdo, te paso con una persona del equipo para que continúe contigo. Un momento, por favor.","failurePolicy":{"action":"TERMINATE_AND_CALLBACK","message":"Ahora mismo no ha sido posible comunicarte con una persona del equipo. Hemos registrado tu solicitud para que puedan devolverte la llamada. Gracias."}}}'

      - name: Verify deployed Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          BODY=""
          for attempt in $(seq 1 20); do
            if BODY="$(curl --fail --silent --show-error --max-time 5 "$FAST_WORKER_ORIGIN/health")"; then
              break
            fi
            sleep 2
          done
          test -n "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.service !== "gemini-control-plane-fast") process.exit(1);
          ' "$BODY"

      - name: Remove ephemeral Wrangler config
        if: always()
        shell: bash
        run: rm -f wrangler.fast.runtime.jsonc

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Gemini fast Cloudflare Worker"
            echo "- Worker: \`ia-realtime-centercall-gemini-fast\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- KV binding: \`TENANT_ROUTING_KV\` resolved dynamically by namespace name"
            echo "- Safe placeholders include route, tenant capabilities and human handoff configuration"
            echo "- Transfer configuration exposes destination phone, success announcement and fixed failure TTS message in tenant KV"
            echo "- Existing KV values are never overwritten by deployment seeding"
            echo "- Repository contains no Cloudflare KV namespace ID"
            echo "- Health: \`${FAST_WORKER_ORIGIN}/health\`"
            echo "- Stable OpenAI Worker config was not used by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
