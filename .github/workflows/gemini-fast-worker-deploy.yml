name: Gemini Fast Worker Deploy

on:
  push:
    branches:
      - rebuild/v39-stable-baseline
    paths:
      - "apps/gemini-control-plane/**"
      - ".github/workflows/gemini-fast-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-fast-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy independent Gemini fast Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gemini-control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate fast Worker artifact
        run: npm run check

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy independent Gemini fast Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:fast 2>&1 | tee /tmp/gemini-fast-worker-deploy.log

      - name: Verify deployed Worker is visible to Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --config wrangler.fast.jsonc

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Gemini fast Cloudflare Worker"
            echo "- Worker: \`ia-realtime-centercall-gemini-fast\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Config: \`apps/gemini-control-plane/wrangler.fast.jsonc\`"
            echo "- Stable OpenAI Worker config was not used by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
