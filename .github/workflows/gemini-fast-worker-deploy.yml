name: Gemini Fast Worker Deploy

on:
  push:
    branches:
      - rebuild/v39-stable-baseline
    paths:
      - "apps/gemini-control-plane/**"
      - ".github/workflows/gemini-fast-worker-deploy.yml"
  pull_request:
    paths:
      - ".github/workflows/gemini-fast-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-fast-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy independent Gemini fast Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gemini-control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FAST_WORKER_ORIGIN: https://ia-realtime-centercall-gemini-fast.julopezcardona.workers.dev
      TENANT_ROUTING_KV_NAMESPACE: ia-realtime-centercall-gemini-fast-tenant-routing-kv

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate fast Worker artifact
        run: npm run check

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve tenant routing KV namespace
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          LIST="$(curl --fail --silent --show-error \
            -H "$AUTH" \
            "${API}?per_page=1000")"

          KV_ID="$(node -e '
            const payload = JSON.parse(process.argv[1]);
            const title = process.argv[2];
            if (payload.success !== true) process.exit(2);
            const match = (payload.result || []).find((item) => item.title === title);
            if (match?.id) process.stdout.write(match.id);
          ' "$LIST" "$TENANT_ROUTING_KV_NAMESPACE")"

          if [ -z "$KV_ID" ]; then
            echo "KV namespace not found; creating it by logical name."
            CREATED="$(curl --fail --silent --show-error \
              -X POST \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "{\"title\":\"${TENANT_ROUTING_KV_NAMESPACE}\"}" \
              "$API")"
            KV_ID="$(node -e '
              const payload = JSON.parse(process.argv[1]);
              if (payload.success !== true || !payload.result?.id) process.exit(2);
              process.stdout.write(payload.result.id);
            ' "$CREATED")"
          fi

          test -n "$KV_ID"
          echo "KV namespace resolved: ${TENANT_ROUTING_KV_NAMESPACE}"
          echo "TENANT_ROUTING_KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Build ephemeral Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('wrangler.fast.jsonc', 'utf8'));
          const id = process.env.TENANT_ROUTING_KV_ID;
          if (!id) throw new Error('TENANT_ROUTING_KV_ID was not resolved');
          source.kv_namespaces = [{ binding: 'TENANT_ROUTING_KV', id }];
          fs.writeFileSync('wrangler.fast.runtime.jsonc', `${JSON.stringify(source, null, 2)}\n`);
          NODE

      - name: Deploy independent Gemini fast Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.fast.runtime.jsonc 2>&1 | tee /tmp/gemini-fast-worker-deploy.log
          grep -q 'TENANT_ROUTING_KV' /tmp/gemini-fast-worker-deploy.log

      - name: Verify deployed Worker is visible to Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --config wrangler.fast.runtime.jsonc

      - name: Seed safe placeholder tenant route
        shell: bash
        run: |
          set -euo pipefail
          KEY='tenant_by_phone:+34XXXXXXXXX'
          VALUE='{"tenant_id":"TENANT_ID_A_COMPLETAR","route_id":"default","enabled":false}'
          ENCODED_KEY="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$KEY")"
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${TENANT_ROUTING_KV_ID}/values/${ENCODED_KEY}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          STATUS="$(curl --silent --show-error \
            -o /tmp/tenant-routing-placeholder \
            -w '%{http_code}' \
            -H "$AUTH" \
            "$URL")"

          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error \
              -X PUT \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "$VALUE" \
              "$URL" >/dev/null
            echo "Created disabled placeholder route: $KEY"
          elif [ "$STATUS" = "200" ]; then
            echo "Placeholder route already exists; leaving it unchanged."
          else
            echo "Unexpected KV lookup status: $STATUS" >&2
            cat /tmp/tenant-routing-placeholder >&2 || true
            exit 1
          fi

      - name: Verify deployed Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          BODY=""
          for attempt in $(seq 1 20); do
            if BODY="$(curl --fail --silent --show-error --max-time 5 "$FAST_WORKER_ORIGIN/health")"; then
              break
            fi
            sleep 2
          done
          test -n "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.service !== "gemini-control-plane-fast") process.exit(1);
          ' "$BODY"

      - name: Remove ephemeral Wrangler config
        if: always()
        shell: bash
        run: rm -f wrangler.fast.runtime.jsonc

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Gemini fast Cloudflare Worker"
            echo "- Worker: \`ia-realtime-centercall-gemini-fast\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- KV binding: \`TENANT_ROUTING_KV\` resolved dynamically by namespace name"
            echo "- Repository contains no Cloudflare KV namespace ID"
            echo "- Health: \`${FAST_WORKER_ORIGIN}/health\`"
            echo "- Stable OpenAI Worker config was not used by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
