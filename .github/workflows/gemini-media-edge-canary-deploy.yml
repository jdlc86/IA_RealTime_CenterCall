name: Gemini Media Edge Canary Deploy

on:
  push:
    branches:
      - rebuild/v39-stable-baseline
    paths:
      - "apps/gemini-media-edge/**"
      - ".github/workflows/gemini-media-edge-canary-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gemini-media-edge-canary
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: iacallcenterv1
  GCP_REGION: europe-west9
  GCP_WIF_PROVIDER: projects/1012718461242/locations/global/workloadIdentityPools/github-actions/providers/ia-realtime-centercall
  GCP_DEPLOYER_SERVICE_ACCOUNT: github-cloud-run-deployer@iacallcenterv1.iam.gserviceaccount.com
  GEMINI_API_KEY_SECRET_VERSION: "1"
  CREDENTIAL_SECRET_VERSION: "1"
  CONTROL_TOKEN_SECRET_VERSION: "1"

jobs:
  deploy:
    name: Deploy canary to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/gemini-media-edge/package-lock.json

      - name: Install Media Edge dependencies
        run: npm ci
        working-directory: apps/gemini-media-edge

      - name: Validate Media Edge
        run: |
          npm run check
          npm test
        working-directory: apps/gemini-media-edge

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify federated identity
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACTIVE_ACCOUNT" = "$GCP_DEPLOYER_SERVICE_ACCOUNT"
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"

      - name: Deploy immutable Media Edge canary
        shell: pwsh
        run: |
          ./apps/gemini-media-edge/deploy/cloud-run/deploy.ps1 `
            -ProjectId "${{ env.GCP_PROJECT_ID }}" `
            -Region "${{ env.GCP_REGION }}" `
            -GeminiApiKeySecretVersion "${{ env.GEMINI_API_KEY_SECRET_VERSION }}" `
            -CredentialSecretVersion "${{ env.CREDENTIAL_SECRET_VERSION }}" `
            -ControlTokenSecretVersion "${{ env.CONTROL_TOKEN_SECRET_VERSION }}" `
            -ImageTag "canary-${{ github.sha }}"

      - name: Resolve deployed revision
        id: deployed
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe gemini-media-edge --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          SERVICE_URL="$(gcloud run services describe gemini-media-edge --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          IMAGE="$(gcloud run services describe gemini-media-edge --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
          test -n "$REVISION"
          test -n "$SERVICE_URL"
          test -n "$IMAGE"
          EDGE_URL="wss://${SERVICE_URL#https://}/telnyx/gemini"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "edge_url=$EDGE_URL" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify real Gemini Live function-call contract
        id: provider_contract
        shell: bash
        run: |
          set -euo pipefail
          JOB="gemini-media-edge-provider-probe"
          gcloud run jobs deploy "$JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.deployed.outputs.image }}" \
            --service-account "gemini-media-edge@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --command "node" \
            --args "src/live-provider-contract-probe.mjs" \
            --set-secrets "GEMINI_API_KEY=gemini-media-edge-gemini-api-key:${GEMINI_API_KEY_SECRET_VERSION}" \
            --set-env-vars "GEMINI_LIVE_MODEL=gemini-3.1-flash-live-preview" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 30s \
            --quiet
          gcloud run jobs execute "$JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          echo "status=ready" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Cloud Run security and readiness
        run: npm run test:e2e:cloud-run -- "${{ steps.deployed.outputs.edge_url }}"
        working-directory: apps/gemini-media-edge

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Gemini Media Edge canary"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Revision: \`${{ steps.deployed.outputs.revision }}\`"
            echo "- Provider function-call contract: \`${{ steps.provider_contract.outputs.status }}\`"
            echo "- Service URL: \`${{ steps.deployed.outputs.service_url }}\`"
            echo "- WSS: \`${{ steps.deployed.outputs.edge_url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
