name: Control Plane Canary Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "rebuild/v39-stable-baseline"
    paths:
      - ".github/workflows/control-plane-canary-deploy.yml"

permissions:
  contents: read

concurrency:
  group: control-plane-production-canary
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: cfe9a2eaf2742cb20732b21bc389e861
  WORKER_URL: https://ia-realtime-centercall.julopezcardona.workers.dev

jobs:
  deploy:
    name: Deploy canary to production Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require scoped Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required." >&2
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: apps/control-plane/.node-version
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies
        run: npx --yes npm@10.9.2 clean-install --progress=false --no-audit --no-fund

      - name: Validate production Worker
        run: |
          npm test
          npm run check:production

      - name: Deploy exact commit to production Worker
        run: npm run deploy:production

      - name: Verify production health
        run: npm run test:e2e:health -- --url "$WORKER_URL" --environment production

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Control Plane production canary"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Worker: \`ia-realtime-centercall\`"
            echo "- Health: \`${WORKER_URL}/health\`"
          } >> "$GITHUB_STEP_SUMMARY"
