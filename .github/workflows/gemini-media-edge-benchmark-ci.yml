name: Gemini Media Edge Benchmark CI

on:
  pull_request:
    paths:
      - "apps/gemini-media-edge-benchmark/**"
      - ".github/workflows/gemini-media-edge-benchmark-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gemini-media-edge-benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: apps/gemini-media-edge-benchmark/.node-version

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build container
        run: docker build -t gemini-media-edge-benchmark:test .
