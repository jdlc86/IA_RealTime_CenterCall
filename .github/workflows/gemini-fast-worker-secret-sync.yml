name: Gemini Fast Worker Secret Sync

on:
  push:
    branches:
      - rebuild/v39-stable-baseline
    paths:
      - ".github/workflows/gemini-fast-worker-secret-sync.yml"
  pull_request:
    paths:
      - ".github/workflows/gemini-fast-worker-secret-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Sync Gemini runtime secrets to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: iacallcenterv1
      GCP_WIF_PROVIDER: projects/1012718461242/locations/global/workloadIdentityPools/github-actions/providers/ia-realtime-centercall
      GCP_DEPLOYER_SERVICE_ACCOUNT: github-cloud-run-deployer@iacallcenterv1.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
      TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
      WORKER_NAME: ia-realtime-centercall-gemini-fast

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Gemini control-plane dependencies
        working-directory: apps/gemini-control-plane
        run: npm install --no-audit --no-fund

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING:${name}"
              exit 1
            fi
            echo "PRESENT:${name}"
          done

      - name: Report reusable Telnyx credential presence
        id: telnyx
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TELNYX_API_KEY TELNYX_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING:${name}"
              missing=1
            else
              echo "PRESENT:${name}"
            fi
          done
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"

      - name: Sync Telnyx secrets without exposing values
        if: steps.telnyx.outputs.missing == '0'
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TELNYX_API_KEY" | npx wrangler secret put TELNYX_API_KEY --name "$WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
          printf '%s' "$TELNYX_PUBLIC_KEY" | npx wrangler secret put TELNYX_PUBLIC_KEY --name "$WORKER_NAME" --config wrangler.fast.jsonc >/dev/null

      - name: Sync Media Edge shared secrets without exposing values
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          HMAC_SECRET="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret gemini-media-edge-credential-hmac-secret)"
          CONTROL_TOKEN="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret gemini-media-edge-control-plane-token)"
          test -n "$HMAC_SECRET"
          test -n "$CONTROL_TOKEN"
          printf '%s' "$HMAC_SECRET" | npx wrangler secret put GEMINI_MEDIA_CREDENTIAL_HMAC_SECRET --name "$WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put GEMINI_MEDIA_CONTROL_PLANE_TOKEN --name "$WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
          unset HMAC_SECRET CONTROL_TOKEN
          echo "PRESENT:GEMINI_MEDIA_CREDENTIAL_HMAC_SECRET"
          echo "PRESENT:GEMINI_MEDIA_CONTROL_PLANE_TOKEN"

      - name: Ensure independent admission identity secret exists
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler secret list --name "$WORKER_NAME" --config wrangler.fast.jsonc 2>/dev/null | grep -q 'GEMINI_ADMISSION_IDENTITY_SECRET'; then
            echo "PRESENT:GEMINI_ADMISSION_IDENTITY_SECRET"
          else
            IDENTITY_SECRET="$(openssl rand -base64 48)"
            printf '%s' "$IDENTITY_SECRET" | npx wrangler secret put GEMINI_ADMISSION_IDENTITY_SECRET --name "$WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
            unset IDENTITY_SECRET
            echo "CREATED:GEMINI_ADMISSION_IDENTITY_SECRET"
          fi

      - name: Confirm synchronized Gemini runtime secret names exist
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx wrangler secret list --name "$WORKER_NAME" --config wrangler.fast.jsonc)"
          for name in GEMINI_MEDIA_CREDENTIAL_HMAC_SECRET GEMINI_MEDIA_CONTROL_PLANE_TOKEN GEMINI_ADMISSION_IDENTITY_SECRET; do
            echo "$SECRET_LIST" | grep -q "$name"
            echo "PRESENT:${name}"
          done
          if [ "${{ steps.telnyx.outputs.missing }}" = "0" ]; then
            for name in TELNYX_API_KEY TELNYX_PUBLIC_KEY; do
              echo "$SECRET_LIST" | grep -q "$name"
              echo "PRESENT:${name}"
            done
          fi

      - name: Require reusable Telnyx credentials before E2E
        if: steps.telnyx.outputs.missing != '0'
        shell: bash
        run: |
          echo "BLOCKED:TELNYX_GITHUB_ACTIONS_SECRETS_MISSING"
          exit 1

      # Operational sync probe requested after Gemini Worker deployment isolation.
