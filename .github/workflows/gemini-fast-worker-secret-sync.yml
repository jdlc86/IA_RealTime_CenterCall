name: Gemini Fast Worker Secret Sync

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Sync Gemini runtime secrets to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: iacallcenterv1
      GCP_WIF_PROVIDER: projects/1012718461242/locations/global/workloadIdentityPools/github-actions/providers/ia-realtime-centercall
      GCP_DEPLOYER_SERVICE_ACCOUNT: github-cloud-run-deployer@iacallcenterv1.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
      TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
      FAST_WORKER_NAME: ia-realtime-centercall-gemini-fast
      CALLER_SECURITY_HMAC_SECRET_NAME: caller-security-hmac-secret
      CALLER_SECURITY_HMAC_FINGERPRINT_SECRET_NAME: caller-security-hmac-sha256

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Gemini control-plane dependencies
        working-directory: apps/gemini-control-plane
        run: npm install --no-audit --no-fund

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING:${name}"
              exit 1
            fi
            echo "PRESENT:${name}"
          done

      - name: Report optional GitHub Telnyx secret sources
        id: telnyx
        shell: bash
        run: |
          set -euo pipefail
          for name in TELNYX_API_KEY TELNYX_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_GITHUB_SOURCE:${name}"
            else
              echo "PRESENT_GITHUB_SOURCE:${name}"
            fi
          done

      - name: Sync Telnyx API key when GitHub source is available
        if: env.TELNYX_API_KEY != ''
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TELNYX_API_KEY" | npx wrangler secret put TELNYX_API_KEY --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
          echo "SYNCED:TELNYX_API_KEY"

      - name: Sync Telnyx public key when GitHub source is available
        if: env.TELNYX_PUBLIC_KEY != ''
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TELNYX_PUBLIC_KEY" | npx wrangler secret put TELNYX_PUBLIC_KEY --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
          echo "SYNCED:TELNYX_PUBLIC_KEY"

      - name: Sync Media Edge shared secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          HMAC_SECRET="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret gemini-media-edge-credential-hmac-secret)"
          CONTROL_TOKEN="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret gemini-media-edge-control-plane-token)"
          CALLER_SECURITY_HMAC_SECRET="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret "$CALLER_SECURITY_HMAC_SECRET_NAME")"
          EXPECTED_CALLER_SECURITY_HMAC_SHA256="$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret "$CALLER_SECURITY_HMAC_FINGERPRINT_SECRET_NAME")"
          test -n "$HMAC_SECRET"
          test -n "$CONTROL_TOKEN"
          test -n "$CALLER_SECURITY_HMAC_SECRET"
          [[ "$EXPECTED_CALLER_SECURITY_HMAC_SHA256" =~ ^[a-f0-9]{64}$ ]]
          ACTUAL_CALLER_SECURITY_HMAC_SHA256="$(printf '%s' "$CALLER_SECURITY_HMAC_SECRET" | sha256sum | awk '{print $1}')"
          test "$ACTUAL_CALLER_SECURITY_HMAC_SHA256" = "$EXPECTED_CALLER_SECURITY_HMAC_SHA256"
          printf '%s' "$HMAC_SECRET" | (cd apps/gemini-control-plane && npx wrangler secret put GEMINI_MEDIA_CREDENTIAL_HMAC_SECRET --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc >/dev/null)
          printf '%s' "$CONTROL_TOKEN" | (cd apps/gemini-control-plane && npx wrangler secret put GEMINI_MEDIA_CONTROL_PLANE_TOKEN --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc >/dev/null)
          printf '%s' "$CALLER_SECURITY_HMAC_SECRET" | (cd apps/gemini-control-plane && npx wrangler secret put CALLER_SECURITY_HMAC_SECRET --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc >/dev/null)
          unset HMAC_SECRET CONTROL_TOKEN CALLER_SECURITY_HMAC_SECRET EXPECTED_CALLER_SECURITY_HMAC_SHA256 ACTUAL_CALLER_SECURITY_HMAC_SHA256
          echo "PRESENT:GEMINI_MEDIA_CREDENTIAL_HMAC_SECRET"
          echo "PRESENT:GEMINI_MEDIA_CONTROL_PLANE_TOKEN"
          echo "PRESENT:CALLER_SECURITY_HMAC_SECRET"

      - name: Ensure independent admission identity secret exists
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler secret list --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc 2>/dev/null | grep -q 'GEMINI_ADMISSION_IDENTITY_SECRET'; then
            echo "PRESENT:GEMINI_ADMISSION_IDENTITY_SECRET"
          else
            IDENTITY_SECRET="$(openssl rand -base64 48)"
            printf '%s' "$IDENTITY_SECRET" | npx wrangler secret put GEMINI_ADMISSION_IDENTITY_SECRET --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc >/dev/null
            unset IDENTITY_SECRET
            echo "CREATED:GEMINI_ADMISSION_IDENTITY_SECRET"
          fi

      - name: Confirm required Gemini Worker secret names exist
        working-directory: apps/gemini-control-plane
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx wrangler secret list --name "$FAST_WORKER_NAME" --config wrangler.fast.jsonc)"
          missing=0
          for name in \
            TELNYX_API_KEY \
            TELNYX_PUBLIC_KEY \
            GEMINI_MEDIA_CREDENTIAL_HMAC_SECRET \
            GEMINI_MEDIA_CONTROL_PLANE_TOKEN \
            CALLER_SECURITY_HMAC_SECRET \
            GEMINI_ADMISSION_IDENTITY_SECRET; do
            if echo "$SECRET_LIST" | grep -q "$name"; then
              echo "PRESENT:${name}"
            else
              echo "MISSING:${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "BLOCKED:REQUIRED_GEMINI_WORKER_SECRET_MISSING"
            exit 1
          fi
